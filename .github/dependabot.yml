version: 2
updates:
    # Enable Github Action updates
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "daily"
      commit-message:
          prefix: "chore(GHA)"
      labels:
          - "dependencies"
          - "patch"
          - "actions"
      groups:
          # One group for everything, majors included, since an action
          # major is usually just a runtime bump
          github-actions-all:
              patterns:
                  - "*"
              update-types:
                  - "minor"
                  - "patch"
                  - "major"