name: Checkov and Sonarqube Scans
 
on:
  workflow_call:
    secrets:
      sonar_token:
        required: true
      sonar_host_url:
        required: true
      EXEMPTIONS_APP_ID:
        description: Exemptions secret applied by the Core Cloud team when exceptions are approved and required.
        required: false
      EXEMPTIONS_APP_PRIVATE_KEY:
        description: Exemptions secret applied by the Core Cloud team when exceptions are approved and required.
        required: false
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  actions: read
  security-events: write

jobs:
  checkov-scan:
    uses: Home-Office-Digital/core-cloud-workflow-checkov-sast-scan/.github/workflows/checkov-scan-base.yaml@121fa86c79521d82b4f92237493584f44d6d8143 # 1.21.0

  sonarqube-scanner:
    uses: Home-Office-Digital/core-cloud-workflow-sonarqube-scan/.github/workflows/sonarqube-scan.yaml@3f9613d4c02f2f84fb4982982c1b9cf8bf773579 #1.2.0
    secrets:
      sonar_token: ${{ secrets.sonar_token }}
      sonar_host_url: ${{ secrets.sonar_host_url }
